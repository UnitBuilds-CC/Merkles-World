[workspace]
resolver = "2"
members = ["contracts", "crates/coords", "crates/ledger", "crates/memory", "crates/render"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
# The licence is decided (OQ-43, 2026-10-11: MIT OR Apache-2.0, see LICENSE-MIT / LICENSE-APACHE).
# `publish` stays false for the other half of OQ-43/OQ-37: the engine and game have no final names,
# and `contracts` / `coords` are placeholders rather than brands, so nothing goes to a registry
# until the names and the two-product repo split are chosen.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Hot-path discipline (AGENTS.md §3): a frame must not allocate or format.
alloc_instead_of_core = "deny"
std_instead_of_core = "deny"
