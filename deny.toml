# cargo-deny — the dependency half of the CI gate (docs/11 Phase 0, ADR-025's merge rules).
#
# The workspace's first third-party dependency landed with ADR-028: **BLAKE3**, via `crates/ledger`,
# and its own transitive set (`cc`, `cfg-if`, `arrayvec`, `constant_time_eq`, `cpufeatures` — the
# SIMD build). `contracts` and `crates/coords` stay std-free by design, and `ledger` is `no_std` with
# `default-features = false` precisely so the browser target keeps compiling. So this file is no
# longer only a check that catches the first crate: it is the check that audits the one we took.

[graph]
# The three architectures gate C2 names (docs/02). A dependency that does not build for one of
# them is a Phase 0 failure, not a Phase 1 discovery.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
    { triple = "wasm32-unknown-unknown" },
]
all-features = true

[advisories]
# `paste` arrives through wgpu's tree and is reported unmaintained: RUSTSEC-2024-0436. The id is taken
# from cargo-deny's own CI output, not guessed - an invented identifier would be fabricating the evidence
# a waiver exists to record. A crate-name entry here was tried first and cargo-deny read it as a yanked-
# crate waiver (warning: not detected), so the id is the only form that matches what it actually flags.
# Drop this line if paste leaves the graph; its absence is the signal, not a cleanup task.
ignore = [
    "RUSTSEC-2024-0436",
    # ttf-parser is reported **unmaintained**, not vulnerable: RUSTSEC-2026-0192 has no CVE and no bad
    # version range, and the id is again taken from cargo-deny's own CI output. It cannot be trimmed
    # away either — `ab_glyph` depends on `owned_ttf_parser` non-optionally, `epaint` depends on
    # `ab_glyph` for every glyph it draws, so the only way out of it is to turn off egui's
    # `default_fonts` and hand the editor a font file, which AGENTS.md §6 forbids outright (a .ttf is
    # an art asset). The reach is also tool-only: `editor` is the sole workspace member that pulls it,
    # and §3 keeps the editor off the frame path, so nothing the runtime hashes or ships touches it.
    # Dropping this line returns trunk to that policy question, which is why it is recorded here.
    "RUSTSEC-2026-0192",
]

[bans]
# Duplicate versions are a determinism hazard specifically when the duplicated crate hashes
# something (BLAKE3, SPEC-04). Warn now; promote to "deny" the first time a hashing crate appears
# twice rather than after the desync it would have caught.
multiple-versions = "warn"
highlight = "all"

# `AGENTS.md` §3 bans string parsing, allocation churn and reflection **on the frame path**, and
# explicitly permits them in tools (`assetc`, the packer, validators). cargo-deny resolves the whole
# graph and cannot tell those two apart, so a `deny` list here would block the tools on principle
# and be deleted the first time one is needed. The hot-path rule stays enforced where it is
# observable: `crates/*` lints (`unsafe_code = "forbid"`, `std-instead-of-core`) plus review.
deny = []

[licenses]
# `allow` is exhaustive in this schema: a license outside it, or one that cannot be detected at
# all, is a diagnostic rather than a configurable lint level (the `default`/`unlicensed` keys were
# removed upstream). A per-category policy (copyleft, OSI/FSF) is a product decision that travels
# with OQ-43, not a dependency-hygiene one.
confidence-threshold = 0.93
# While the graph was empty, every entry below was "not encountered" by definition — one warning per
# allowance per run, all of them meaningless. BLAKE3 is the commit that adds the first dependency, so
# as this file instructed: back to `warn`, which prunes the allowance list against crates we actually
# ship. Warnings do not fail the job; a licence outside `allow` does.
unused-allowed-license = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    # unicode-ident 1.0.13 moved to "(MIT OR Apache-2.0) AND Unicode-3.0", and both wit-parser (the
    # A-02 parse check) and serde_derive (the assetc RON path) require it, so pinning is not
    # available. Allowed because the Unicode Terms of Use is a data/character-database licence, not a
    # copyleft one - but this is OQ-43 territory, so it is flagged for ratification rather than
    # treated as settled: revert this line and the trunk goes back to a policy question.
    "Unicode-3.0",
    # hexf-parse (a naga dependency, reached through wgpu's SPIR-V/DXIL paths that
    # wgpu-core-deps-windows-linux-android enables) is CC0-1.0, a public-domain dedication
    # rather than a licence with obligations. Allowed by the OQ-51 decision to admit wgpu;
    # it cannot be feature-trimmed away, as the spike branch proved. Reverting this line
    # returns trunk to a policy question, which is the point of recording it here.
    "CC0-1.0",
    # epaint_default_fonts — the two UI fonts egui embeds — is licensed
    # "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-UFL-1.0", so both font licences have to be
    # named before the editor can draw a single label. OFL-1.1 is OSI-approved and FSF-free: it
    # obliges nothing of a distributor that ships the font unmodified inside a binary, and only
    # requires that a *modified* font stay OFL. UFL-1.0 (Ubuntu Font Licence) is the same BSD-like
    # permission with the same reservation. Neither is copyleft for our use, and neither can be
    # feature-trimmed: turning off egui's `default_fonts` means supplying our own font file, which
    # AGENTS.md §6 bans outright — a .ttf is an art asset. Note these licenses cover data files
    # inside a dependency crate, not anything added to this repository.
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]

[licenses.private]
# Flipped to false in the commit that closes the licensing half of OQ-43 (2026-10-11: MIT OR
# Apache-2.0, declared in [workspace.package].license and inherited by both members). While the
# project had no licence the members declared none either, so cargo-deny had to be told to skip
# them; now it checks the workspace's own licences too, which is the point of the setting.
# `publish = false` stays for the other half of OQ-43/OQ-37 — unresolved product names.
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
