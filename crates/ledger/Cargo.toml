[package]
name = "ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The A-10 hasher (docs/03 § The tree shape, ADR-030): every digest a peer must agree on"

[dependencies]
contracts = { path = "../../contracts" }
# ADR-028 made BLAKE3-256 the ledger digest and the first external dependency this workspace takes.
# `default-features = false` is not tidiness: it keeps this crate `no_std`, which is what lets the
# same code that produces an epoch root on x86-64 also produce it in a browser — gate P1.5's fourth
# target is M1-browser, so a root that needs an allocator is not a canonical root.
blake3 = { version = "1.8.7", default-features = false }

[lints]
workspace = true
