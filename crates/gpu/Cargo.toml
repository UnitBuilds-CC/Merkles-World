[package]
name = "gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "docs/04's WGSL half: the A-07 master interpreter on a device, checked against the CPU reference (S1, S4, S6, R1)"

[dependencies]
contracts = { path = "../../contracts" }
render = { path = "../render" }
wgpu = "27"
# Only the trait bounds a window must satisfy to have a surface attached to it, so that `gpu` can hand a
# surface to a windowing library without depending on one. `winit` stays a dev-dependency: the boot's
# published output is headless and must remain so.
raw-window-handle = "0.6"
env_logger = "0.11"
pollster = "0.4"
naga = { version = "27", features = ["wgsl-in"] }

[dev-dependencies]
memory = { path = "../memory" }
assetc = { path = "../assetc" }
entity = { path = "../entity" }
# Windowing is a *presentation* dependency and an example's, not the renderer's: nothing on the boot path
# needs a window, and `cargo run -p engine`'s published output must stay a headless 18 lines. The owner
# cleared this class of dependency on 2026-10-18 (MIT/Apache-2.0, no copyleft) for the Phase 1 exit's
# "renders a procedural SDF scene" half, which no headless harness can show.
#
# `default-features = false` is not a size preference, it is a security read. winit's defaults pull the
# Wayland client-side-decoration stack (`wayland` → `sctk` → `sctk-adwaita` → `ab_glyph` → `owned_ttf_parser`
# → `ttf-parser`), and `ttf-parser` carries RUSTSEC-2026-0192: the author has declared it unmaintained and
# will not fix it, and `cargo deny` reports **no safe upgrade available**. `cargo-deny` failed the workspace
# on it the day this dependency arrived, and being a dev-dependency is not a dispensation. With the defaults
# off, the crate the advisory is filed against is absent from the lockfile rather than ignored in
# `deny.toml`.
#
# What that costs, stated rather than discovered: with the defaults off there is no Linux window backend,
# and winit does not degrade at runtime - its library fails to build at all, from a `compile_error!("The
# platform you're compiling for is not supported by winit")` in its own `lib.rs`. That is a *build* break on
# the x86-64 Linux gate, not the `SKIP demo_window: no window (…)` line the example prints when a display is
# missing. So `x11` is on: it is the one Linux backend that reaches the lockfile without the font stack the
# advisory is filed against. Windows and macOS backends are not feature-gated, which is what the laptop's
# 640x360 run exercises.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }

[lints]
workspace = true
