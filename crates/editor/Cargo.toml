[package]
name = "editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "In-engine entity editor with Dear ImGui UI for visual SDF authoring"

[dependencies]
entity = { path = "../entity" }
assetc = { path = "../assetc" }
gpu = { path = "../gpu" }
render = { path = "../render" }
contracts = { path = "../../contracts" }
coords = { path = "../coords" }

# eframe handles winit + egui + wgpu integration.
#
# `default-features = false` is deliberate, not tidiness: eframe 0.29's default set enables
# `accesskit` + `web_screen_reader`, and on Linux that drags in accesskit_unix -> zbus ->
# zbus_names/zvariant/zvariant_derive (RUSTSEC-2026-0370/-0371/-0372, all unmaintained) and
# zbus_xml -> quick-xml (RUSTSEC-2026-0194/-0195). Screen-reader support is not something this tool
# is claiming, and dropping the five advisories is cheaper than waiving them. `wayland` goes for the
# same reason -- the editor opens on X11/Windows/Quartz, and an extra platform back end is extra
# graph for nothing.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
] }
egui = "0.29"

# Serialization for RON export
serde = { version = "1", features = ["derive"] }
ron = "0.8"

# The MCP server's wire format. Not a new graph node: `serde_json` 1.0.154 is already in the lock below
# `wit-parser`, which `contracts` pulls as a dev-dependency — this makes an existing crate a direct one,
# so `cargo deny` sees the same set it saw before.
serde_json = "1"

# Writing a rendered frame out as a PNG, from the library (`mcp::render_view`) rather than only from an
# example. `image` is already in the lock via eframe, and `png` is its only feature here — a dev-dependency
# would not do, because the module that saves the frame is part of the crate.
image = { version = "0.25", default-features = false, features = ["png"] }

# Logging
env_logger = "0.11"

[lints]
workspace = true
