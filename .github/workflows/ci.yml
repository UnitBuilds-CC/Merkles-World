# CI — the Phase 0 gate harness (docs/11 § Phase 0, docs/12 § merge rules, ADR-025).
#
# What this file proves, in the order the jobs run:
#   gates    — fmt, clippy -D warnings, and the C1–C4 + A-09 + A-10 tests on the architectures that
#              must agree (x86-64 Linux, x86-64 Windows, ARM64 macOS), plus the C2 and A-10 root
#              vectors and the C4 demo printed to the log so a divergence is visible, not just red.
#   wasm     — contracts, coords and the ledger hasher compile for `wasm32-unknown-unknown`: the
#              third architecture gate C2 names, the only proof here that `#![no_std]` still bites,
#              and the reason a canonical root is computable in a browser (gate P1.5's fourth target).
#   deny     — dependency hygiene against `deny.toml`. Since BLAKE3 (ADR-028) this graph is not
#              empty, so the job checks something rather than proving a config parses.
#   docs     — links, anchors, tables and the spec↔contract mirror in docs/ (the docs are the spec;
#              a broken reference in a public repo is a product defect).
#
# Deliberately absent:
#   * Gate **R4** (frame hashes across `wgpu` backends) is informational and must never be a gate
#     (ADR-017, docs/11 § Bitwise Determinism Suite). No job here may promote it.
#   * The S6 headless shader check that docs/11 lists for Phase 0. Spike S6 has not run, there is
#     no WGSL in the tree yet, and a job that gates on a harness which does not exist teaches
#     everyone to ignore red CI. It joins this file when S6 lands.
#   * Running the A-10 vectors *inside* a WASM runtime: they compile for the browser target, and the
#     runner that executes them there is spike S6's sibling, OQ-41. Until then P1.5 is three targets,
#     not four, and docs/11 says so.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Pinned because `deny.toml` was validated against exactly this build: cargo-deny's config
  # schema has lost keys between releases (`unlicensed`, `default`), so the tool and the config
  # are upgraded together, in one commit, with the check run locally first.
  CARGO_DENY_VERSION: 0.20.2

  # Pinned for the same reason as cargo-deny: the asset schema's guarantees come from a generator, so
  # the generator's version is part of the check. Upgraded together with contracts/sdf.fbs, in one
  # commit, with `flatc --version` run locally first.
  FLATC_VERSION: 24.3.25

jobs:
  gates:
    name: gates on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64 Linux
            os: ubuntu-latest
          - label: x86-64 Windows
            os: windows-latest
          # Apple Silicon: the ARM64 of gate C2's list, which no self-hosted x86 runner gives us.
          - label: ARM64 macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and installs clippy/rustfmt/wasm32 on first use.
      - name: Toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lints (clippy -D warnings, all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: Gates C1–C4, A-09 taxonomy, A-10 shape, spec↔contract mirror
        run: cargo test --workspace

      - name: Gate C2 vectors for this architecture
        run: cargo run --release --example gate_vectors

      - name: A-10 root vectors for this architecture
        run: cargo run --release --example root_vectors -p ledger

      # Spike S2 printed, not asserted: a latency number on a shared runner is evidence about the
      # runner, so docs/03 carries the measurement and these steps only show the code runs anywhere.
      # Gate P1.2's own status is recorded against one machine, and OQ-49 is the open question about
      # P1.3 — neither is promoted to a CI gate here.
      - name: Spike S2 slab throughput (informational)
        run: cargo run --release --example slab_throughput -p memory

      - name: Spike S2 Merkle pass (informational)
        run: cargo run --release --example merkle_pass -p ledger

      # OQ-49's decision packet: where the sub-millisecond line falls as N shrinks, and what spreading the
      # same edits across eight regions costs. Digest counts, not milliseconds, are the part that repeats.
      - name: Spike S2 pass budget sweep (informational)
        run: cargo run --release --example pass_budget -p ledger

      # Gate P1.4's cost half, on the same reasoning as the two rows above: the digest counts repeat
      # across runners and the milliseconds do not, so this is the number the pop-in decision argues
      # about - never a pass/fail.
      - name: Re-entry cost of a cold region (informational)
        run: cargo run --release --example re_entry_cost -p ledger

      # Spike S1's CPU half: evaluations per ray on a four-node scene. Informational for the same
      # reason as S2's numbers - a runner cannot measure a GPU frame budget, so nothing here gates.
      - name: Spike S1 march steps (informational)
        run: cargo run --release --example scene_steps -p render

      # The cull probe prints counts only, so unlike the timings above it is comparable across runners -
      # and it is the baseline a BVH has to beat, which is worth having on the record per commit.
      - name: Enclosure cull probe (informational)
        run: cargo run --release --example cull_probe -p render

      # Spike S7's first half: how long a distant consequence takes to arrive, and what a commit costs
      # when it may only touch the disturbed width. Printed, never asserted - it is a model of integers,
      # not of consensus, and the consensus half of gate SM1 cannot be measured until A-04 and A-05 exist.
      - name: Spike S7 macro propagation (informational)
        run: cargo run --release --example s7_propagation -p engine

      # The frame law - steps x nodes - plus the first pixels this repo has produced. Informational for
      # the same reason as the others: a runner cannot measure a GPU frame budget, and the step counts are
      # the part that repeats across architectures while the milliseconds do not.
      - name: Raster probe and node-cost sweep (informational)
        run: cargo run --release --example raster_probe -p render

      # The engine asserts docs/03's published vectors itself, so running it is a gate check rather
      # than a smoke test: a wrong digest anywhere in slab -> commit -> read -> march exits non-zero.
      - name: Engine boots and reproduces the published vectors
        run: cargo run -p engine

      - name: Gate C4 camera-relative demo
        run: cargo run --release --example camera_f32_demo

  wasm:
    name: wasm32-unknown-unknown build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show
      - name: Build contracts, coords, the ledger hasher and the slab for the browser target
        run: cargo build --target wasm32-unknown-unknown -p contracts -p coords -p ledger -p memory

      # Gate P1.5's fourth target family, and the part that was wrongly filed as blocked. The export-lint
      # decision (OQ-41) is about a module *exporting* functions for a host to call; it has nothing to do
      # with running a WASI command, whose `_start` comes from the Rust runtime rather than from an
      # unsafe attribute in this repository. So the whole engine is built for wasm32-wasip1, executed
      # under a WASM engine, and its output diffed against the native build's. The boot prints the epoch
      # root, the region list and the slot table, so an identical diff is a statement about hashed state
      # on a fourth kind of target - not yet spike S3's M1 *browser*, which needs a browser.
      - name: Install the WASI target
        run: rustup target add wasm32-wasip1

      - name: Build the engine as a WASI command module
        run: cargo build --release --target wasm32-wasip1 -p engine

      - name: Run the engine under a WASM engine and diff it against the host build
        run: |
          set -euo pipefail
          node --version
          cargo run --release -q -p engine > host.txt
          node --experimental-wasi-unstable-preview1 tools/wasm_parity.mjs \
            target/wasm32-wasip1/release/engine.wasm > wasm.txt 2> wasm.err
          # An empty file diffs clean against an empty file. The engine asserts its own vectors, so if it
          # ever exits early the comparison below would be vacuous - check there is something to compare.
          test -s wasm.txt || { echo "the WASM run printed nothing"; exit 1; }
          # Node's WASI support is experimental and warns on stderr; anything else on that stream is a
          # failure worth seeing, so keep it visible rather than swallowing it.
          grep -v 'ExperimentalWarning\|trace-warnings' wasm.err >&2 || true
          if ! diff -u host.txt wasm.txt; then
            echo "^^^ the WASM build and the host build disagree; a root has diverged across engines" >&2
            exit 1
          fi
          echo "parity: $(wc -l < host.txt) lines identical, including:"
          grep -E 'epoch root|region list|slot table' wasm.txt

  # Gate P1.5's WASM target, executed rather than compiled, on all three architectures - and the reason
  # it is a separate job rather than a step in `wasm` is the point: the browser target spike S3 names is
  # an *ARM* one, and a wasm32 module built and run only on x86-64 Linux proves less than the same module
  # run under ARM64 V8. Node's WASI is the host here, not a browser, so this is a fourth kind of target
  # rather than S3's fourth device; the distinction is recorded in docs/11 and docs/03, not hidden by a
  # green tick.
  wasm-execute:
    name: roots executed in WASM on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64 Linux
            os: ubuntu-latest
          - label: x86-64 Windows
            os: windows-latest
          - label: ARM64 macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Architecture and Node version of this runner
        shell: bash
        run: |
          uname -m
          node --version
      - name: Install the WASI target
        run: rustup target add wasm32-wasip1
      - name: Build the engine as a WASI command module
        run: cargo build --release --target wasm32-wasip1 -p engine
      # bash on every runner: the Windows default shell is PowerShell, where `set -euo pipefail` is a
      # no-op and `2>&1` is a parse error - which is exactly how this step first failed trunk, on a
      # syntax difference rather than a divergent root.
      - name: Run it under a WASM engine and diff against the native build
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -q -p engine > host.txt
          node --experimental-wasi-unstable-preview1 tools/wasm_parity.mjs \
            target/wasm32-wasip1/release/engine.wasm > wasm.txt 2> wasm.err
          test -s wasm.txt || { echo "the WASM run printed nothing"; exit 1; }
          grep -v 'ExperimentalWarning\|trace-warnings' wasm.err >&2 || true
          if ! diff -u host.txt wasm.txt; then
            echo "^^^ roots differ between the host build and WASM on this architecture" >&2
            exit 1
          fi
          echo "parity ok on $(uname -m): $(wc -l < host.txt) lines identical"
          grep -E 'epoch root|region list|slot table' wasm.txt

  # Gate P1.5's browser clause, run rather than assumed. A browser has no WASI, so running the engine in
  # one was recorded here as waiting on the export-lint decision - it does not: a wasip1 *command* exports
  # `_start` from the Rust runtime, and `tools/wasi_shim.mjs` supplies the twelve host functions the
  # module imports. The control step runs that shim under bare V8 first, with no `node:wasi`, and requires
  # it to reproduce the native boot byte for byte; only then is the browser's answer about the browser.
  # Scope, stated because the green tick would otherwise overclaim: every engine below that is reachable
  # from CI is Chromium-family, i.e. V8 again. This closes "can a browser host produce these roots", not
  # "a second WebAssembly implementation agrees" - that is WebKit/JSC on the M1 the gate names.
  browser-execute:
    name: roots in a browser on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86-64 Linux
            os: ubuntu-latest
          - label: x86-64 Windows
            os: windows-latest
          - label: ARM64 macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the WASI target
        shell: bash
        run: rustup target add wasm32-wasip1
      - name: Build the engine as a WASI command module
        shell: bash
        run: cargo build --release --target wasm32-wasip1 -p engine

      # The control. If the shim itself disagrees with the native build, a browser result would mean
      # nothing, so this step has to fail before the next one is allowed to be interesting.
      - name: Shim under bare V8 matches the native boot
        shell: bash
        run: |
          set -euo pipefail
          cargo run --release -q -p engine > host.txt
          node tools/shim_parity.mjs target/wasm32-wasip1/release/engine.wasm > shim.txt
          test -s shim.txt || { echo "the shim run printed nothing"; exit 1; }
          if ! diff -u host.txt shim.txt; then
            echo "^^^ the hand-written WASI shim disagrees with the native build on $(uname -m)" >&2
            exit 1
          fi
          echo "shim parity ok on $(uname -m): $(wc -l < host.txt) lines identical"

      - name: The same module inside a browser engine
        shell: bash
        run: |
          set -euo pipefail
          browser=""
          for candidate in \
            "google-chrome" "google-chrome-stable" "chromium" "chromium-browser" \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/c/Program Files/Google/Chrome/Application/chrome.exe" \
            "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe"; do
            # -x handles a path (including one with spaces, quoted); command -v handles a name on PATH.
            if [ -x "$candidate" ] || command -v "$candidate" >/dev/null 2>&1; then
              browser="$candidate"
              break
            fi
          done
          if [ -z "$browser" ]; then
            echo "SKIP: no browser binary found on ${{ matrix.label }} - the shim parity step above still ran"
            exit 0
          fi
          node tools/browser_parity_server.mjs target/wasm32-wasip1/release/engine.wasm --port 8137 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          # Chrome's own exit code is not the claim - on a container runner it writes DBus noise and can
          # return non-zero after a perfectly good dump (run 38287747974 failed trunk that way, with the
          # page digest never even reached). So tolerate the status, and gate on the artifact instead: no
          # DOM is a failure, a DOM whose digest disagrees is a failure, and a DOM that matches is the
          # measurement.
          chrome_status=0
          "$browser" --headless=new --disable-gpu --no-sandbox --disable-dev-shm-usage --no-first-run \
            --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8137/ > dom.html 2>chrome.log \
            || chrome_status=$?
          test -s dom.html || { echo "chrome produced no DOM (status $chrome_status)"; tail -20 chrome.log; exit 1; }
          echo "chrome status $chrome_status, DOM $(wc -c < dom.html) bytes"
          page=$(grep -o 'mlws-sha256=[0-9a-f]\{64\}' dom.html | head -1 | cut -d= -f2)
          test -n "$page" || { echo "the page printed no digest"; sed -n '1,40p' dom.html; exit 1; }
          # Which imported functions the shim had to refuse rather than implement. Informational, and
          # deliberately not a pass/fail: this is how a reader sees what the module really asks a host.
          echo "stubs called: $(grep -o 'mlws-stubs=[^ ]*' dom.html | head -1 | cut -d= -f2)"
          # macOS ships `shasum`, Linux and Git-Bash-on-Windows ship `sha256sum`; the same file, either way.
          if command -v sha256sum >/dev/null 2>&1; then
            expected=$(sha256sum host.txt | cut -d' ' -f1)
          else
            expected=$(shasum -a 256 host.txt | cut -d' ' -f1)
          fi
          echo "browser: $browser"
          echo "native sha256 : $expected"
          echo "browser sha256: $page"
          if [ "$page" != "$expected" ]; then
            echo "^^^ the browser's output differs from the native boot" >&2
            exit 1
          fi
          echo "browser parity ok on ${{ matrix.label }}"

  schema:
    name: asset schema (flatc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned flatc
        run: |
          set -euo pipefail
          asset="Linux.flatc.binary.g++-13.zip"
          base="https://github.com/google/flatbuffers/releases/download/v${FLATC_VERSION}"
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors -o flatc.zip "${base}/${asset}"
          unzip -q flatc.zip -d flatc-dist
          echo "$PWD/flatc-dist" >> "$GITHUB_PATH"

      # The schema's central promise is a layout claim: a node is 16 inline bytes, because that is what
      # lets the compiled asset be the WGSL storage buffer with no repacking step. Checking it through
      # the generator is the point - the Rust type says `[u8; 16]` or the promise is not true.
      - name: Generate Rust and assert the node struct is 16 inline bytes
        run: |
          set -euo pipefail
          flatc --version
          flatc --rust --gen-all -o /tmp/fbsgen contracts/sdf.fbs
          grep -q 'pub struct NodeRecord(pub \[u8; 16\])' /tmp/fbsgen/*.rs
          grep -q 'grammar_version' /tmp/fbsgen/*.rs

      # Pack the committed probe asset. This is a golden file for the format before `assetc` exists to
      # produce one: it proves the schema is emittable, not only parseable.
      - name: Pack the probe shape asset
        run: |
          set -euo pipefail
          flatc -o /tmp/packed --binary --raw-binary --strict-json             contracts/sdf.fbs contracts/tests/fixtures/probe_shape.json
          ls -l /tmp/packed/probe_shape.bin

      # Read the packed bytes back with the compiler's own parser and check the fields survived. Two
      # claims worth a CI check: the format is decodable by an implementation that is not ours, and a
      # fixed-layout struct's four words arrive intact instead of being reinterpreted. Note what is
      # absent from the dump - grammar_version, because FlatBuffers omits a field equal to its schema
      # default - so the assertions name the fields that must appear rather than every field there is.
      - name: Read the packed asset back with flatc
        run: |
          set -euo pipefail
          flatc -o /tmp/dump --json --raw-binary contracts/sdf.fbs -- /tmp/packed/probe_shape.bin
          cat /tmp/dump/probe_shape.json
          grep -q "depth: 1" /tmp/dump/probe_shape.json
          grep -q "kind_and_arity: 1" /tmp/dump/probe_shape.json
          grep -q "params_len_reserved: 4" /tmp/dump/probe_shape.json
          grep -q "unit sphere at the origin" /tmp/dump/probe_shape.json

      # The compiler's own acceptance test, by the same outside parser: the RON fixture goes in through
      # the CLI and the bytes that come out must be readable by a parser that is not ours. A
      # hand-built FlatBuffer only our own reader accepts is not a format - an earlier draft crashed
      # flatc with an inconsistent vtable.
      - name: Read assetc's written asset back with flatc
        run: |
          set -euo pipefail
          cargo run -q -p assetc -- crates/assetc/tests/fixtures/sphere.ron /tmp/assetc_written.bin
          flatc -o /tmp/assetc_dump --json --raw-binary contracts/sdf.fbs -- /tmp/assetc_written.bin
          cat /tmp/assetc_dump/assetc_written.json
          grep -q "depth: 1" /tmp/assetc_dump/assetc_written.json
          grep -q "kind_and_arity: 0" /tmp/assetc_dump/assetc_written.json
          grep -q "params_len_reserved: 4" /tmp/assetc_dump/assetc_written.json
          # The CLI labels an asset with its source file, which is the point of the field: a hot-reload
          # log has to name what failed. Asserting the label the writer actually produces is also what
          # caught a stale assertion here - the fixture's prose label is a different file's value.
          grep -q 'label: "sphere.ron"' /tmp/assetc_dump/assetc_written.json

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned cargo-deny
        run: |
          set -euo pipefail
          asset="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}"
          # Release-asset downloads flake: run 38245836230 red the trunk on a bare `curl: (22) ... 504`
          # from a CDN edge, with nothing wrong in the commit. Retry the transient, never the verdict -
          # if the pin cannot be fetched after three tries the job still fails.
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors -O "${base}/${asset}"
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors -O "${base}/${asset}.sha256"
          # The .sha256 asset is a bare digest, so re-attach the filename `sha256sum -c` needs.
          tr 'A-Z' 'a-z' < "${asset}.sha256" > checksum.line
          sed -i "s/\$/  ${asset}/" checksum.line
          sha256sum --check checksum.line
          tar xzf "$asset"
          sudo install "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny" /usr/local/bin

      - name: cargo deny check
        run: cargo deny check all -s

  docs:
    name: docs integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Links, anchors, tables, contract mirror
        run: node tools/check_docs.mjs
